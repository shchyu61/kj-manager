# ══════════════════════════════════════════════════════════════
# ============================================================
# GitHub Actions：條件W 週選擇權做多（雲端專用）自動掃描排程
# 檔案位置：.github/workflows/condw_scan.yml
# 建立：2026/07/01 10:49　v07011049
# 說明：
#   條件W = 跳過第一二道、只跑第三道5分K V轉觸底翻揚 → 台指(^TWII) buy call
#   進場窗：週二15:05~週三10:45、週四15:05~週五10:45（跨夜，含夜盤）
#   同窗同向最多2次（Firebase 2-slot 原子認領去重，跨cron行程）
#   不靠筆電、雲端直接寄 Gmail 到手機
#
#   ★ TEST_MODE 由 sed 設為 'condW'（因 Python 目前未讀取 TEST_MODE 環境變數，
#     故用 sed 直接改寫該行最穩定；此步驟僅在本 job 的執行副本上進行）
#   ★ 實際窗邊界(15:05/11:30)由 Python scan_condition_w() 自行把關，cron 略寬無妨
#   ✅08091324 窗尾由 10:45 延伸至 11:00（主帥指定）。
#   ✅09021415 窗尾由 11:00 延伸至 11:30（主帥 09/02 14:00 指定）。
#     ★★★沿革一律記在此處，嚴禁只改數字不留沿革（今日 11:00/11:30 混淆之教訓）。
#     ★同步修改 cron：原 '0-2' 只到 UTC 02:45＝台灣 10:45，光改 Python 無效。
#       這正是 08060105 的反向教訓（當時是 cron 加了但 Python 閘門擋掉，等於白加）。
#
# 台灣時間 = UTC+8
# ============================================================

name: 條件W週選擇權雙向雲端掃描

on:
  schedule:
    # ── 窗一：週二15:05~週三11:30（台灣）= 週二07:05~週三03:30（UTC）──
    #   ✅09021415 窗尾 11:00→11:30（主帥 09/02 14:00 指令）
    # 週二 07:05~23:xx UTC（每15分，自:05起）
    - cron: '5/15 7-23 * * 2'
    # 週三 00:00~02:45 UTC（每15分）
    - cron: '*/15 0-3 * * 3'   # ✅08091324 UTC 0-3＝台灣08:00-11:59
                               # ✅09021415 窗尾改11:30後【本班次仍足夠涵蓋】，cron 不需再動

    # ── 窗二：週四15:05~週五11:30（台灣）= 週四07:05~週五03:30（UTC）──
    # 週四 07:05~23:xx UTC（每15分，自:05起）
    - cron: '5/15 7-23 * * 4'
    # 週五 00:00~02:45 UTC（每15分）
    - cron: '*/15 0-3 * * 5'   # ✅08091324 同上，週五亦延伸

  # 允許手動觸發（測試用）
  workflow_dispatch:

# ✅08251403【新增 concurrency】主帥指示「AI 若要我自己加，必須由AI自己加」，
#   ★本區塊由 AI 直接加好，主帥不需要動手編輯任何一行。
#   ★用途：同一個 workflow 同時只跑一個，★避免迴圈取樣時前後兩次執行重疊、
#     ★兩個行程同時寫同一份 Firestore 文件而互相覆蓋。
#   ★★cancel-in-progress 必須為 false：★設 true 會把累積到一半的執行砍掉。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Job：條件W 週選擇權做多掃描
  # ============================================================
  condw-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8     # 單次僅掃台指5分K，數分鐘足夠

    steps:
      # 1. 取得程式碼
      - name: 取得程式碼
        uses: actions/checkout@v4

      # 2. 安裝 Python 3.12
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 安裝所需套件
      - name: 安裝套件
        run: |
          pip install yfinance pandas pandas-ta pytz twstock cryptography google-auth requests

      # 4. 設定 TEST_MODE='condW'（sed 改寫執行副本，不影響倉庫原檔行為）
      - name: 設定條件W模式
        run: |
          sed -i "s/^TEST_MODE = False/TEST_MODE = 'condW'/" 3_stock_monitor_GitHub.py
          echo "已設定 TEST_MODE='condW'"
          grep -n "^TEST_MODE = " 3_stock_monitor_GitHub.py

      # 5. 執行條件W掃描
      - name: 執行條件W週選擇權做多掃描
        env:
          GMAIL_ACCOUNT:        ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_PASSWORD:       ${{ secrets.GMAIL_PASSWORD }}
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
        run: |
          python 3_stock_monitor_GitHub.py
